<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>suhree — 3D 여행</title>
    <style>
      :root {
        --panel: #1c1f26;
        --line: #2b303a;
        --fg: #e6e9ef;
        --dim: #8b93a3;
        --acc: #ffd166;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        font:
          13px/1.5 "Malgun Gothic",
          system-ui,
          sans-serif;
        background: #0e1013;
        color: var(--fg);
        overflow: hidden;
      }
      aside {
        width: 210px;
        flex: none;
        background: var(--panel);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
      }
      aside h1 {
        font-size: 13px;
        margin: 0;
        padding: 12px;
        border-bottom: 1px solid var(--line);
      }
      aside h1 small {
        display: block;
        color: var(--dim);
        font-weight: 400;
        font-size: 11px;
        margin-top: 2px;
      }
      #online {
        max-height: 130px;
        overflow-y: auto;
        padding: 8px 12px;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
      }
      .online-head {
        color: var(--acc);
        font-weight: 600;
        margin-bottom: 4px;
      }
      .online-row {
        color: var(--fg);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #find {
        margin: 8px 8px 0;
        padding: 5px 8px;
        background: #12141a;
        border: 1px solid var(--line);
        border-radius: 4px;
        color: var(--fg);
        font: inherit;
        width: calc(100% - 16px);
      }
      #roster {
        flex: 1;
        overflow-y: auto;
        padding: 8px;
      }
      #roster button {
        display: block;
        width: 100%;
        text-align: left;
        padding: 6px 8px;
        margin: 0 0 2px;
        background: none;
        border: 0;
        border-radius: 4px;
        color: var(--fg);
        font: inherit;
        cursor: pointer;
      }
      #roster button:hover {
        background: #252a34;
      }
      #roster button.on {
        background: var(--acc);
        color: #0b0e14;
        font-weight: 600;
      }
      #help {
        padding: 10px 12px;
        border-top: 1px solid var(--line);
        color: var(--dim);
        font-size: 11px;
        line-height: 1.7;
      }
      #help b {
        color: var(--fg);
      }
      main {
        flex: 1;
        position: relative;
        min-width: 0;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* 이름표 + 말풍선 오버레이 */
      #tags {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .tag {
        position: absolute;
        left: 0;
        top: 0;
        text-align: center;
        white-space: nowrap;
      }
      .tag .name {
        display: inline-block;
        margin-top: 2px;
        padding: 1px 7px;
        font-size: 11px;
        color: #fff;
        background: rgba(14, 16, 19, 0.55);
        border-radius: 8px;
        text-shadow: 0 1px 2px #000a;
      }
      .tag .name.mine {
        background: rgba(255, 209, 102, 0.85);
        color: #201a05;
        font-weight: 600;
      }
      .tag .bubble {
        max-width: 220px;
        margin: 0 auto 4px;
        padding: 5px 10px;
        font-size: 12px;
        color: #1c1c1c;
        background: #fffef2;
        border: 1px solid #d9d2ae;
        border-radius: 10px;
        box-shadow: 0 2px 6px #0004;
        white-space: normal;
        word-break: break-all;
      }
      #emo {
        position: absolute;
        left: 12px;
        bottom: 52px;
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
        max-width: 60%;
      }
      #emo button {
        background: rgba(28, 31, 38, 0.9);
        border: 1px solid var(--line);
        border-radius: 4px;
        color: var(--fg);
        font: inherit;
        padding: 3px 8px;
        cursor: pointer;
      }
      #emo button:hover {
        background: #252a34;
      }
      #chatbar {
        position: absolute;
        left: 12px;
        right: 12px;
        bottom: 12px;
        display: flex;
      }
      #chatin {
        flex: 1;
        padding: 7px 12px;
        background: rgba(18, 20, 26, 0.92);
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--fg);
        font: inherit;
        outline: none;
      }
      #chatin:focus {
        border-color: var(--acc);
      }
      #chatlog {
        position: absolute;
        right: 12px;
        bottom: 52px;
        width: 280px;
        max-height: 180px;
        overflow-y: auto;
        padding: 6px 10px;
        background: rgba(14, 16, 19, 0.55);
        border-radius: 8px;
        font-size: 12px;
        pointer-events: none;
      }
      .chat-row {
        margin: 1px 0;
        text-shadow: 0 1px 2px #000c;
        word-break: break-all;
      }
      .chat-row b {
        color: var(--acc);
      }
      #hud {
        position: absolute;
        right: 12px;
        top: 10px;
        color: #fff;
        text-shadow: 0 1px 3px #0009;
        font-size: 11px;
        text-align: right;
        pointer-events: none;
      }
      #loading {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0e1013;
        color: var(--dim);
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <aside>
      <h1>3D 여행<small>수확의 리듬 · 같이 걷는 마을</small></h1>
      <div id="online"></div>
      <input id="find" placeholder="캐릭터 검색…" />
      <div id="roster"></div>
      <div id="help">
        <b>이동</b> WASD / 방향키<br />
        <b>달리기</b> Shift 누르기<br />
        <b>감정표현</b> 1~8 (서 있을 때)<br />
        <b>채팅</b> Enter<br />
        <b>확대/축소</b> 마우스 휠
      </div>
    </aside>
    <main>
      <canvas id="cv"></canvas>
      <div id="tags"></div>
      <div id="emo"></div>
      <div id="chatlog"></div>
      <div id="chatbar"><input id="chatin" placeholder="Enter 를 눌러 채팅…" maxlength="200" autocomplete="off" /></div>
      <div id="hud"><span id="pos"></span></div>
      <div id="loading"><span id="status">불러오는 중…</span></div>
    </main>
    <script type="module" src="/src/travel/main.ts"></script>
  </body>
</html>
